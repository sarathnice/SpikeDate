name: SpikeDate staging QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test suite
        type: choice
        options: [smoke, photos, full]
        default: smoke
      profiles:
        description: Synthetic profiles per mobile device (1-50)
        default: '3'
        required: true

permissions:
  contents: read

concurrency:
  group: spikedate-staging-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPIKEDATE_PLAYWRIGHT_CHANNEL: bundled
      QA_MODE: ${{ inputs.mode }}
      QA_PROFILES: ${{ inputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run staging QA (never deploys or resets fixtures)
        run: npm run qa -- --url https://spikedate-stage.sarathnice.workers.dev --mode "$QA_MODE" --profiles "$QA_PROFILES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spikedate-qa-report
          path: outputs/qa/
          retention-days: 7
          if-no-files-found: warn

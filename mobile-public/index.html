<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <title>PULSE</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 18%, #351722, #0e0e10 45%, #08080a); color: #f5f5f6; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 320px; }
      b { display: block; color: #ff4d6d; letter-spacing: .3em; font-size: 1rem; }
      h1 { margin: 24px 0 10px; font-size: 1.7rem; }
      p { margin: 0; color: #aaaab2; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <b>PULSE</b>
      <h1>Staging is offline</h1>
      <p>Start the PULSE development website, then reopen the app to continue testing.</p>
    </main>
  </body>
</html>

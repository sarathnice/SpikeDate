<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1A1A2E" />
    <title>SpikeDate</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #1a1a2e;
        color: #f5f5f6;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      img {
        width: 78px;
        height: 78px;
      }
      b {
        display: block;
        margin-top: 12px;
        color: #ff7650;
        letter-spacing: -0.03em;
        font-size: 1.2rem;
        font-weight: 600;
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 1.7rem;
      }
      p {
        margin: 0;
        color: #aaaab2;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/spikedate-icon.svg" alt="" />
      <b>SpikeDate</b>
      <h1>Staging is offline</h1>
      <p>
        Start the SpikeDate development website, then reopen the app to continue
        testing.
      </p>
    </main>
  </body>
</html>

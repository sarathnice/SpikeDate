services:
  pulse-dev:
    profiles: [dev]
    build:
      context: .
      target: development
    command: npm run dev -- --host 0.0.0.0
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - pulse_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SPIKEDATE_SERVER_DATA_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_SERVER_DATA_ENABLED:-false}
      NEXT_PUBLIC_SPIKEDATE_DATE_PLANS_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_DATE_PLANS_ENABLED:-true}
      NEXT_PUBLIC_SPIKEDATE_PHONE_VERIFICATION_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_PHONE_VERIFICATION_ENABLED:-true}
      SPIKEDATE_PHONE_VERIFICATION_REQUIRED: ${SPIKEDATE_PHONE_VERIFICATION_REQUIRED:-true}
      SPIKEDATE_PHONE_VERIFICATION_PROVIDER: ${SPIKEDATE_PHONE_VERIFICATION_PROVIDER:-mock}
      SPIKEDATE_PHONE_VERIFICATION_TOKEN_SECRET: ${SPIKEDATE_PHONE_VERIFICATION_TOKEN_SECRET:-local-development-secret-change-me}
      SPIKEDATE_DATE_PLANS_ENABLED: ${SPIKEDATE_DATE_PLANS_ENABLED:-true}
      NEXT_PUBLIC_PULSE_VOICE_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_ENABLED:-true}
      NEXT_PUBLIC_PULSE_VOICE_COMMAND_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_COMMAND_ENABLED:-false}
      NEXT_PUBLIC_PULSE_VOICE_LIVE_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_LIVE_ENABLED:-false}
      NEXT_PUBLIC_PULSE_VOICE_CLOUD_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_CLOUD_ENABLED:-false}
      NEXT_PUBLIC_PULSE_VOICE_TEST_MODE: ${NEXT_PUBLIC_PULSE_VOICE_TEST_MODE:-true}
      PULSE_VOICE_CLOUD_ENABLED: ${PULSE_VOICE_CLOUD_ENABLED:-false}
      SPIKEDATE_MEDIA_MODERATION_MODE: ${SPIKEDATE_MEDIA_MODERATION_MODE:-mock}
      SPIKEDATE_PUSH_PROVIDER: ${SPIKEDATE_PUSH_PROVIDER:-in_app}

  pulse-staging:
    profiles: [staging]
    build:
      context: .
      target: staging
      args:
        NEXT_PUBLIC_SPIKEDATE_SERVER_DATA_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_SERVER_DATA_ENABLED:-true}
        NEXT_PUBLIC_SPIKEDATE_DATE_PLANS_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_DATE_PLANS_ENABLED:-true}
        NEXT_PUBLIC_SPIKEDATE_PHONE_VERIFICATION_ENABLED: ${NEXT_PUBLIC_SPIKEDATE_PHONE_VERIFICATION_ENABLED:-true}
        NEXT_PUBLIC_PULSE_VOICE_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_ENABLED:-true}
        NEXT_PUBLIC_PULSE_VOICE_COMMAND_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_COMMAND_ENABLED:-false}
        NEXT_PUBLIC_PULSE_VOICE_LIVE_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_LIVE_ENABLED:-false}
        NEXT_PUBLIC_PULSE_VOICE_CLOUD_ENABLED: ${NEXT_PUBLIC_PULSE_VOICE_CLOUD_ENABLED:-false}
        NEXT_PUBLIC_PULSE_VOICE_TEST_MODE: ${NEXT_PUBLIC_PULSE_VOICE_TEST_MODE:-true}
    environment:
      SPIKEDATE_DATE_PLANS_ENABLED: ${SPIKEDATE_DATE_PLANS_ENABLED:-true}
      SPIKEDATE_PHONE_VERIFICATION_REQUIRED: ${SPIKEDATE_PHONE_VERIFICATION_REQUIRED:-true}
      SPIKEDATE_PHONE_VERIFICATION_PROVIDER: ${SPIKEDATE_PHONE_VERIFICATION_PROVIDER:-firebase}
      SPIKEDATE_PHONE_VERIFICATION_TOKEN_SECRET: ${SPIKEDATE_PHONE_VERIFICATION_TOKEN_SECRET}
      FIREBASE_IDENTITY_PLATFORM_API_KEY: ${FIREBASE_IDENTITY_PLATFORM_API_KEY}
      SPIKEDATE_MEDIA_MODERATION_MODE: ${SPIKEDATE_MEDIA_MODERATION_MODE:-manual}
      SPIKEDATE_PUSH_PROVIDER: ${SPIKEDATE_PUSH_PROVIDER:-in_app}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      PULSE_VOICE_CLOUD_ENABLED: ${PULSE_VOICE_CLOUD_ENABLED:-false}
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  pulse_node_modules:
